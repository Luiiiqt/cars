<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        /* Reset and base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body Styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            margin: 0;
        }

        /* Form Container Styling */
        form {
            background-color: rgba(255, 255, 255, 0.9);  /* Slightly more opaque for better readability */
            backdrop-filter: blur(12px);  /* Softer blur */
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);  /* Softer, larger shadow */
            padding: 40px 30px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            transition: transform 0.3s ease-out;
        }

        form:hover {
            transform: translateY(-5px);  /* Slight hover effect on form container */
        }

        /* Form Heading */
        form h2 {
            font-size: 26px;
            font-weight: 600;
            color: #333;
            margin-bottom: 25px;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
        }

        /* Form Field Styling */
        form div {
            margin-bottom: 25px;
        }

        /* Labels for inputs */
        label {
            font-size: 14px;
            color: #333;
            font-weight: 500;
            display: block;
            margin-bottom: 8px;
            text-align: left;
        }

        /* Input Fields Styling */
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            outline: none;
            box-sizing: border-box;
            background-color: #f8f8f8;
            color: #333;
            transition: border 0.3s ease, box-shadow 0.3s ease;
        }

        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #6c63ff;
            box-shadow: 0 0 8px rgba(108, 99, 255, 0.3);  /* Subtle glow effect on focus */
        }

        /* Submit Button Styling */
        button {
            width: 100%;
            padding: 15px;
            background-color: #6c63ff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        button:hover {
            background-color: #5a52e3;
            transform: translateY(-2px);  /* Slight hover animation */
        }

        /* Register Link Styling */
        a {
            display: block;
            margin-top: 20px;
            color: #6c63ff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        a:hover {
            color: #4a43d4;
            text-decoration: underline;
        }

        /* Focus styles for accessibility */
        input:focus, button:focus {
            outline: 3px solid #6c63ff;
            outline-offset: 3px;
        }

        /* Loading animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        form {
            animation: fadeIn 0.6s ease-out;
        }

        /* Responsive design */
        @media (max-width: 1200px) {
            form {
                padding: 35px 25px;
            }

            button {
                padding: 14px;
                font-size: 15px;
            }
        }

        @media (max-width: 768px) {
            form {
                padding: 30px 20px;
            }

            button {
                padding: 12px;
                font-size: 14px;
            }

            label {
                font-size: 13px;
            }
        }

        @media (max-width: 576px) {
            form {
                padding: 25px 15px;
            }

            button {
                padding: 12px;
                font-size: 13px;
            }

            label {
                font-size: 12px;
            }
        }

        /* Reduced motion support */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
<form th:action="@{/login}" method="post">
    <div>
        <label>Username:</label>
        <input type="text" name="username"/>
    </div>
    <div>
        <label>Password:</label>
        <input type="password" name="password"/>
    </div>
    <button type="submit">Login</button>
</form>

<!-- show error message if login fails -->
<div th:if="${param.error}">
    Invalid username or password
</div>

<!-- show message after logout -->
<div th:if="${param.logout}">
    You have been logged out
</div>

<a th:href="@{/register}">Register Here.</a>
</body>
</html>
