<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Car Inventory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>

  <body class="bg-gradient-to-br from-sky-100 via-blue-50 to-indigo-100 min-h-screen flex items-center justify-center p-8">
    <div id="root" class="w-full flex justify-center items-center"></div>

    <script type="text/babel">
      const apiBase = "http://localhost:2121/api/cars";
      const loginUrl = "http://localhost:2121/api/auth/login";
      const registerUrl = "http://localhost:2121/api/auth/register";

      function App() {
        const [cars, setCars] = React.useState([]);
        const [showModal, setShowModal] = React.useState(false);
        const [token, setToken] = React.useState(localStorage.getItem("token") || "");
        const [editingCar, setEditingCar] = React.useState(null);
        const [form, setForm] = React.useState({
          licensePlateNumber: "",
          make: "",
          model: "",
          year: "",
          color: "",
          bodyType: "",
          engineType: "",
          transmission: ""
        });

        const [loginForm, setLoginForm] = React.useState({ username: "", password: "" });
        const [registerForm, setRegisterForm] = React.useState({ username: "", password: "" });
        const [showRegister, setShowRegister] = React.useState(false);

        React.useEffect(() => {
          if (token) fetchCars();
        }, [token]);

        function fetchCars() {
          fetch(apiBase, { headers: { Authorization: `Bearer ${token}` } })
            .then(res => res.json())
            .then(setCars)
            .catch(console.error);
        }

        function openCreateModal() {
          setEditingCar(null);
          setForm({
            licensePlateNumber: "",
            make: "",
            model: "",
            year: "",
            color: "",
            bodyType: "",
            engineType: "",
            transmission: ""
          });
          setShowModal(true);
        }

        function openEditModal(car) {
          setEditingCar(car);
          setForm({
            licensePlateNumber: car.licensePlateNumber,
            make: car.make,
            model: car.model,
            year: car.year,
            color: car.color,
            bodyType: car.bodyType,
            engineType: car.engineType,
            transmission: car.transmission
          });
          setShowModal(true);
        }

        function closeModal() {
          setShowModal(false);
        }

        function handleChange(e) {
          const { id, value } = e.target;
          setForm(prev => ({ ...prev, [id]: value }));
        }

        function handleLoginChange(e) {
          const { id, value } = e.target;
          setLoginForm(prev => ({ ...prev, [id]: value }));
        }

        function handleRegisterChange(e) {
          const { id, value } = e.target;
          setRegisterForm(prev => ({ ...prev, [id]: value }));
        }

        function saveCar(e) {
          e.preventDefault();
          const method = editingCar ? "PUT" : "POST";
          const url = editingCar ? `${apiBase}/${editingCar.id}` : apiBase;

          fetch(url, {
            method,
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`
            },
            body: JSON.stringify(form)
          })
            .then(res => res.json())
            .then(() => {
              closeModal();
              fetchCars();
            })
            .catch(console.error);
        }

        function deleteCar(id) {
          if (!confirm("Delete this car?")) return;
          fetch(`${apiBase}/${id}`, {
            method: "DELETE",
            headers: { Authorization: `Bearer ${token}` }
          })
            .then(() => fetchCars())
            .catch(console.error);
        }

        function loginUser(e) {
          e.preventDefault();
          fetch(loginUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(loginForm)
          })
            .then(res => {
              if (!res.ok) throw new Error("Invalid credentials");
              return res.json();
            })
            .then(data => {
              localStorage.setItem("token", data.token);
              setToken(data.token);
              fetchCars();
            })
            .catch(() => alert("Login failed. Please check your credentials."));
        }

        function registerUser(e) {
          e.preventDefault();
          fetch(registerUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(registerForm)
          })
            .then(res => {
              if (!res.ok) throw new Error("Registration failed");
              return res.json();
            })
            .then(() => {
              alert("Registration successful! Please log in.");
              setShowRegister(false);
            })
            .catch(() => alert("Registration failed. Try again."));
        }

        function logout() {
          localStorage.removeItem("token");
          setToken("");
          setCars([]);
        }

        // ============ LOGIN PAGE ============
        if (!token) {
          return (
            <div className="fixed inset-0 flex items-center justify-center bg-black/30 backdrop-blur-sm">
              <div className="bg-white rounded-2xl shadow-2xl w-[28rem] p-10 relative">
                <h2 className="text-3xl font-bold mb-6 text-gray-800 text-center">
                  {showRegister ? "Register" : "Login"}
                </h2>

                {showRegister ? (
                  <form onSubmit={registerUser}>
                    <div className="mb-5">
                      <label className="block text-gray-700 font-medium mb-1">Username</label>
                      <input
                        id="username"
                        value={registerForm.username}
                        onChange={handleRegisterChange}
                        className="border border-gray-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-300 p-3 w-full rounded-md outline-none transition"
                        required
                      />
                    </div>
                    <div className="mb-8">
                      <label className="block text-gray-700 font-medium mb-1">Password</label>
                      <input
                        id="password"
                        type="password"
                        value={registerForm.password}
                        onChange={handleRegisterChange}
                        className="border border-gray-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-300 p-3 w-full rounded-md outline-none transition"
                        required
                      />
                    </div>
                    <div className="flex justify-between items-center">
                      <button
                        type="button"
                        onClick={() => setShowRegister(false)}
                        className="text-blue-600 hover:underline"
                      >
                        Already have an account? Login
                      </button>
                      <button
                        type="submit"
                        className="px-6 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 transition"
                      >
                        Register
                      </button>
                    </div>
                  </form>
                ) : (
                  <form onSubmit={loginUser}>
                    <div className="mb-5">
                      <label className="block text-gray-700 font-medium mb-1">Username</label>
                      <input
                        id="username"
                        value={loginForm.username}
                        onChange={handleLoginChange}
                        className="border border-gray-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-300 p-3 w-full rounded-md outline-none transition"
                        required
                      />
                    </div>
                    <div className="mb-8">
                      <label className="block text-gray-700 font-medium mb-1">Password</label>
                      <input
                        id="password"
                        type="password"
                        value={loginForm.password}
                        onChange={handleLoginChange}
                        className="border border-gray-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-300 p-3 w-full rounded-md outline-none transition"
                        required
                      />
                    </div>
                    <div className="flex justify-between items-center">
                      <button
                        type="button"
                        onClick={() => setShowRegister(true)}
                        className="text-blue-600 hover:underline"
                      >
                        Create Account
                      </button>
                      <button
                        type="submit"
                        className="px-6 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition"
                      >
                        Login
                      </button>
                    </div>
                  </form>
                )}
              </div>
            </div>
          );
        }

        // ============ MAIN DASHBOARD ============
        return (
          <div className="w-full max-w-6xl bg-white/80 backdrop-blur-lg shadow-xl rounded-2xl p-8 border border-blue-100">
            <div className="flex justify-between items-center mb-6">
              <h1 className="text-3xl font-bold text-gray-700">🚗 Car Inventory</h1>
              <div className="space-x-3">
                <button
                  onClick={openCreateModal}
                  className="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition"
                >
                  Add Car
                </button>
                <button
                  onClick={logout}
                  className="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition"
                >
                  Logout
                </button>
              </div>
            </div>

            <div className="overflow-x-auto">
              <table className="w-full border border-gray-200 text-sm">
                <thead className="bg-blue-100 text-gray-700">
                  <tr>
                    <th className="p-2 border">#</th>
                    <th className="p-2 border">License Plate</th>
                    <th className="p-2 border">Make</th>
                    <th className="p-2 border">Model</th>
                    <th className="p-2 border">Year</th>
                    <th className="p-2 border">Color</th>
                    <th className="p-2 border">Body Type</th>
                    <th className="p-2 border">Engine Type</th>
                    <th className="p-2 border">Transmission</th>
                    <th className="p-2 border">Actions</th>
                  </tr>
                </thead>
                <tbody>
                  {cars.map((car, index) => (
                    <tr key={car.id} className="text-center hover:bg-blue-50 transition">
                      <td className="border p-2">{index + 1}</td>
                      <td className="border p-2">{car.licensePlateNumber}</td>
                      <td className="border p-2">{car.make}</td>
                      <td className="border p-2">{car.model}</td>
                      <td className="border p-2">{car.year}</td>
                      <td className="border p-2">{car.color}</td>
                      <td className="border p-2">{car.bodyType}</td>
                      <td className="border p-2">{car.engineType}</td>
                      <td className="border p-2">{car.transmission}</td>
                      <td className="border p-2 space-x-2">
                        <button
                          onClick={() => openEditModal(car)}
                          className="bg-yellow-500 text-white px-3 py-1 rounded hover:bg-yellow-600"
                        >
                          Edit
                        </button>
                        <button
                          onClick={() => deleteCar(car.id)}
                          className="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600"
                        >
                          Delete
                        </button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            {showModal && (
              <div className="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-10">
                <div className="bg-white rounded-xl shadow-lg w-96 p-6">
                  <h2 className="text-xl font-semibold mb-4 text-gray-700">
                    {editingCar ? "Edit Car" : "Add Car"}
                  </h2>
                  <form onSubmit={saveCar}>
                    {[
                      ["licensePlateNumber", "License Plate Number"],
                      ["make", "Make"],
                      ["model", "Model"],
                      ["year", "Year", "number"],
                      ["color", "Color"],
                      ["bodyType", "Body Type"],
                      ["engineType", "Engine Type"],
                      ["transmission", "Transmission"]
                    ].map(([id, label, type = "text"]) => (
                      <div className="mb-2" key={id}>
                        <label className="block text-gray-700">{label}</label>
                        <input
                          id={id}
                          type={type}
                          value={form[id]}
                          onChange={handleChange}
                          className="border p-2 w-full rounded"
                          required
                        />
                      </div>
                    ))}
                    <div className="flex justify-end mt-4 space-x-2">
                      <button
                        type="button"
                        onClick={closeModal}
                        className="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300"
                      >
                        Cancel
                      </button>
                      <button
                        type="submit"
                        className="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700"
                      >
                        Save
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
